[project]
name = "py-char-bytes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.12.0",
    "spacy>=3.7.0",
    "textstat>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: tests that require a live local Ollama daemon and model runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]
